<!DOCTYPE html>
<html>
<head>
    <title>Traffic AI</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Heatmap -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        #map {
            height: 400px;
            border-radius: 15px;
            margin: 20px 0;
        }

        form {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            margin: 5px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 20px;
            background: #00c6ff;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        .card {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

<h1>🚦 Traffic AI System</h1>

<div id="map"></div>

<button onclick="getLocation()">📍 Use My Location</button>

<form action="/predict" method="post" onsubmit="saveCoords()">
    <input id="lat" name="lat" placeholder="Latitude" required>
    <input id="lon" name="lon" placeholder="Longitude" required><br><br>
    <button type="submit">Predict</button>
</form>

{% if prediction_text %}
<div class="card">
    <h2>{{ prediction_text }}</h2>
    <p>Temp: {{ temp }}</p>
    <p>Rain: {{ rain }}</p>
    <p>Hour: {{ hour }}</p>
</div>

<canvas id="chart"></canvas>
{% endif %}

</div>

<script>
var map = L.map('map').setView([12.97,77.59],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var heat = L.heatLayer([], {radius: 25}).addTo(map);

map.on('click', function(e){
    document.getElementById("lat").value = e.latlng.lat;
    document.getElementById("lon").value = e.latlng.lng;
});

function getLocation(){
    navigator.geolocation.getCurrentPosition(function(pos){
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        document.getElementById("lat").value = lat;
        document.getElementById("lon").value = lon;

        map.setView([lat,lon],13);
    });
}

function saveCoords(){
    localStorage.setItem("lat", document.getElementById("lat").value);
    localStorage.setItem("lon", document.getElementById("lon").value);
}

window.onload = function(){
    let lat = localStorage.getItem("lat");
    let lon = localStorage.getItem("lon");

    if(lat && lon){
        heat.addLatLng([lat, lon, 1]);
    }

    {% if prediction_text %}
    var ctx = document.getElementById("chart").getContext("2d");
    new Chart(ctx,{
        type:'bar',
        data:{
            labels:['Temp','Rain','Hour'],
            datasets:[{
                label:'Live Data',
                data:[{{ temp }},{{ rain }},{{ hour }}]
            }]
        }
    });
    {% endif %}
}
</script>

</body>
</html>
