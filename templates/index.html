<!DOCTYPE html>
<html>
<head>
<title>Traffic AI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background:#141e30;
    color:white;
    margin:0;
}
.container {
    display:flex;
}
#map {
    height:400px;
    flex:2;
}
.panel {
    flex:1;
    padding:20px;
}
input,button {
    width:100%;
    padding:10px;
    margin:5px;
}
button {
    background:#00e5ff;
}
</style>
</head>

<body>

<div class="container">

<div id="map"></div>

<div class="panel">
    <h3>Route</h3>
    <input id="start_place" placeholder="Start city">
    <input id="end_place" placeholder="End city">
    <button onclick="handleSubmit()">Predict</button>

    <h3 id="result"></h3>
    <p id="details"></p>

    <canvas id="chart"></canvas>
</div>

</div>

<script>

const API_URL = "/predict";  // IMPORTANT (no full URL needed)

// MAP
var map = L.map('map').setView([12.97,77.59],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var routeLayer;

// GEOCODE
async function geocode(place){
    let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`);
    let data = await res.json();

    if(!data.length) throw "Location not found";

    return {
        lat: parseFloat(data[0].lat),
        lon: parseFloat(data[0].lon)
    };
}

// ROUTE
async function getRoute(start,end){
    let res = await fetch(
        `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`
    );
    let data = await res.json();
    return data.routes[0].geometry.coordinates;
}

// DRAW
function drawRoute(coords,risk){
    if(routeLayer) map.removeLayer(routeLayer);

    let latlngs = coords.map(c=>[c[1],c[0]]);

    let color = risk.includes("High") ? "red" :
                risk.includes("Medium") ? "orange" : "green";

    routeLayer = L.polyline(latlngs,{color,weight:5}).addTo(map);
    map.fitBounds(routeLayer.getBounds());
}

// BACKEND
async function getPrediction(start,end){
    let res = await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            start_lat:start.lat,
            start_lon:start.lon,
            end_lat:end.lat,
            end_lon:end.lon
        })
    });

    return await res.json();
}

// MAIN
async function handleSubmit(){
    try{
        let start = await geocode(start_place.value);
        let end = await geocode(end_place.value);

        let data = await getPrediction(start,end);

        result.innerText = data.prediction;

        details.innerText =
        `Start: ${data.start_weather.temp}°C | Rain ${data.start_weather.rain}
End: ${data.end_weather.temp}°C | Rain ${data.end_weather.rain}
Hour: ${data.hour}`;

        let route = await getRoute(
            [start.lat,start.lon],
            [end.lat,end.lon]
        );

        drawRoute(route,data.prediction);

        updateChart(data);

    } catch(e){
        alert(e);
    }
}

// CHART
let chart;

function updateChart(data){
    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"),{
        type:'bar',
        data:{
            labels:["S Temp","S Rain","E Temp","E Rain","Hour"],
            datasets:[{
                data:[
                    data.start_weather.temp,
                    data.start_weather.rain,
                    data.end_weather.temp,
                    data.end_weather.rain,
                    data.hour
                ]
            }]
        }
    });
}

</script>

</body>
</html>
