<!DOCTYPE html>
<html>
<head>
    <title>Traffic AI</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            margin: 0;
        }

        h1 {
            margin-top: 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
        }

        #map {
            height: 400px;
            border-radius: 15px;
            margin: 20px 0;
        }

        form {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin: 5px;
            width: 45%;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #00c6ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .card {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚦 Real-Time Traffic Risk Predictor</h1>
    <p>Click on map to select location</p>

    <div id="map"></div>

    <form action="/predict" method="post">
        <input type="text" id="lat" name="lat" placeholder="Latitude" required>
        <input type="text" id="lon" name="lon" placeholder="Longitude" required><br><br>

        <button type="submit">Predict Risk</button>
    </form>

    {% if prediction_text %}
        <div class="card">
            <div class="result">{{ prediction_text }}</div>
            <p>🌡 Temperature: {{ temp }}</p>
            <p>🌧 Rain: {{ rain }}</p>
            <p>⏰ Hour: {{ hour }}</p>
        </div>
    {% endif %}

</div>

<script>
var map = L.map('map').setView([12.9716, 77.5946], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

map.on('click', function(e) {
    document.getElementById('lat').value = e.latlng.lat;
    document.getElementById('lon').value = e.latlng.lng;
});
</script>

</body>
</html>
