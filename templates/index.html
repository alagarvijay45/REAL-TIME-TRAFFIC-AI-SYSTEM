<!DOCTYPE html>
<html>
<head>
    <title>🚦 Traffic AI </title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #141e30;
            --card: rgba(255,255,255,0.08);
            --text: white;
        }

        body.light {
            --bg: #f4f4f4;
            --card: white;
            --text: black;
        }

        body {
            margin:0;
            font-family: 'Segoe UI';
            background: var(--bg);
            color: var(--text);
        }

        .header {
            display:flex;
            justify-content:space-between;
            padding:15px;
            background: rgba(0,0,0,0.3);
        }

        .toggle {
            cursor:pointer;
            padding:8px 12px;
            background:#00e5ff;
            border-radius:8px;
        }

        .layout {
            display:grid;
            grid-template-columns: 250px 1fr;
        }

        .sidebar {
            padding:15px;
            background: rgba(0,0,0,0.2);
        }

        .content {
            padding:15px;
        }

        .card {
            background: var(--card);
            padding:15px;
            margin-bottom:15px;
            border-radius:15px;
        }

        input {
            width:100%;
            padding:10px;
            margin:5px 0;
            border-radius:8px;
            border:none;
        }

        button {
            width:100%;
            padding:10px;
            background:#00e5ff;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        #map {
            height:400px;
            border-radius:15px;
        }

        /* MOBILE */
        @media(max-width:768px){
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2>🚦 Traffic AI</h2>
    <div>
        <span id="clock"></span>
        <span class="toggle" onclick="toggleTheme()">🌙</span>
    </div>
</div>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="card">
            <h3>📍 Route</h3>
            <input id="start_place" placeholder="Start location">
            <input id="end_place" placeholder="Destination">
            <button onclick="handleSubmit()">🚀 Go</button>
        </div>

        <div class="card">
            <h3>🚦 Result</h3>
            <h2 id="result">--</h2>
            <p id="details"></p>
        </div>

    </div>

    <!-- MAIN -->
    <div class="content">

        <div class="card">
            <h3>🗺 Map</h3>
            <div id="map"></div>
        </div>

        <div class="card">
            <h3>📊 Analytics</h3>
            <canvas id="chart"></canvas>
        </div>

    </div>

</div>

<script>

const API_URL = "http://127.0.0.1:5000/predict";

// CLOCK
setInterval(()=>{
    clock.innerText = new Date().toLocaleTimeString();
},1000);

// THEME
function toggleTheme(){
    document.body.classList.toggle("light");
}

// MAP
var map = L.map('map').setView([12.97,77.59],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var routeLayer;

// CLICK MAP → AUTO FILL
map.on('click', async function(e){
    let lat = e.latlng.lat;
    let lon = e.latlng.lng;

    let place = await reverseGeocode(lat, lon);
    start_place.value = place;
});

// GEOCODE
async function geocode(place){
    let url = `https://nominatim.openstreetmap.org/search?format=json&q=${place}`;
    let res = await fetch(url);
    let data = await res.json();

    return {
        lat: parseFloat(data[0].lat),
        lon: parseFloat(data[0].lon)
    };
}

// REVERSE GEOCODE
async function reverseGeocode(lat, lon){
    let url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
    let res = await fetch(url);
    let data = await res.json();

    return data.display_name.split(",")[0];
}

// ROUTE
async function getRoute(start,end){
    let url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

    let res = await fetch(url);
    let data = await res.json();

    return data.routes[0].geometry.coordinates;
}

// DRAW
function drawRoute(coords,risk){

    if(routeLayer){
        map.removeLayer(routeLayer);
    }

    let latlngs = coords.map(c=>[c[1],c[0]]);

    let color = risk.includes("High") ? "red" :
                risk.includes("Medium") ? "orange" : "green";

    routeLayer = L.polyline(latlngs,{color,weight:6}).addTo(map);

    map.fitBounds(routeLayer.getBounds());
}

// BACKEND
async function getPrediction(lat,lon){
    let res = await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({lat,lon})
    });

    return await res.json();
}

// MAIN
async function handleSubmit(){

    let start = await geocode(start_place.value);
    let end = await geocode(end_place.value);

    let data = await getPrediction(start.lat,start.lon);

    result.innerText = data.prediction;
    details.innerText =
        `Temp:${data.temp}°C | Rain:${data.rain} | Hour:${data.hour}`;

    let route = await getRoute(
        [start.lat,start.lon],
        [end.lat,end.lon]
    );

    drawRoute(route,data.prediction);

    updateChart(data.temp,data.rain,data.hour);
}

// CHART
let chart;

function updateChart(t,r,h){
    if(chart) chart.destroy();

    chart = new Chart(chartCanvas.getContext("2d"),{
        type:'line',
        data:{
            labels:['Temp','Rain','Hour'],
            datasets:[{data:[t,r,h]}]
        }
    });
}

</script>

</body>
</html>
