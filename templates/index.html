<!DOCTYPE html>
<html>
<head>
    <title>🚦 Traffic AI </title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI';
            background: linear-gradient(135deg,#141e30,#243b55);
            color:white;
            text-align:center;
        }

        #map {
            height: 400px;
            margin: 15px;
            border-radius: 15px;
        }

        .glass {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 10px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        input, button {
            padding:10px;
            margin:5px;
            border-radius:8px;
            border:none;
        }

        button {
            background:#00e5ff;
            font-weight:bold;
            cursor:pointer;
        }

        #clock {
            font-size:18px;
            color:#00ffcc;
        }
    </style>
</head>

<body>

<h1>🚦 Traffic AI System </h1>

<div id="clock"></div>

<div id="map"></div>

<div class="glass">
<form onsubmit="handleSubmit(event)">
    <input id="start_place" placeholder="Start (e.g. Chennai)" required>
    <input id="end_place" placeholder="Destination (e.g. Bangalore)" required><br>

    <button type="submit">🚀 Predict & Route</button>
</form>
</div>

<div class="glass">
<h2 id="result">Prediction: --</h2>
<p id="details"></p>
</div>

<canvas id="chart"></canvas>

<script>

// ================= CONFIG =================
const API_URL = "http://127.0.0.1:5000/predict"; // change after deploy

// ================= MAP =================
var map = L.map('map').setView([12.97,77.59],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var routeLayer;

// ================= CLOCK =================
function updateClock(){
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);

// ================= GEOCODING =================
async function geocode(place){
    let url = `https://nominatim.openstreetmap.org/search?format=json&q=${place}`;
    let res = await fetch(url);
    let data = await res.json();

    if(data.length === 0){
        alert("Location not found!");
        return null;
    }

    return {
        lat: parseFloat(data[0].lat),
        lon: parseFloat(data[0].lon)
    };
}

// ================= ROUTING =================
async function getRoute(start, end){
    let url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;

    let res = await fetch(url);
    let data = await res.json();

    return data.routes[0].geometry.coordinates;
}

// ================= DRAW =================
function drawRoute(coords, risk){

    if(routeLayer){
        map.removeLayer(routeLayer);
    }

    let latlngs = coords.map(c=>[c[1],c[0]]);

    let color = "green";
    if(risk.includes("High")) color="red";
    else if(risk.includes("Medium")) color="orange";

    routeLayer = L.polyline(latlngs,{
        color:color,
        weight:6
    }).addTo(map);

    map.fitBounds(routeLayer.getBounds());
}

// ================= BACKEND CALL =================
async function getPrediction(lat, lon){

    let res = await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({lat,lon})
    });

    return await res.json();
}

// ================= MAIN =================
async function handleSubmit(e){
    e.preventDefault();

    let startPlace = document.getElementById("start_place").value;
    let endPlace = document.getElementById("end_place").value;

    let start = await geocode(startPlace);
    let end = await geocode(endPlace);

    if(!start || !end) return;

    let data = await getPrediction(start.lat, start.lon);

    document.getElementById("result").innerText =
        `🚦 ${data.prediction}`;

    document.getElementById("details").innerText =
        `Temp: ${data.temp}°C | Rain: ${data.rain}mm | Hour: ${data.hour}`;

    let route = await getRoute(
        [start.lat,start.lon],
        [end.lat,end.lon]
    );

    drawRoute(route, data.prediction);

    updateChart(data.temp, data.rain, data.hour);
}

// ================= CHART =================
let chart;

function updateChart(temp,rain,hour){
    if(chart) chart.destroy();

    var ctx = document.getElementById("chart").getContext("2d");

    chart = new Chart(ctx,{
        type:'bar',
        data:{
            labels:['Temp','Rain','Hour'],
            datasets:[{
                label:'Live Data',
                data:[temp,rain,hour]
            }]
        }
    });
}

</script>

</body>
</html>
