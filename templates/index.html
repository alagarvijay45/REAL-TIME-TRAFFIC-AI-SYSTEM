<!DOCTYPE html>
<html>
<head>
    <title>Traffic AI Pro</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Heatmap -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #1e3c72;
            color: white;
            text-align: center;
        }

        #map {
            height: 400px;
            margin: 20px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        .card {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>🚦 Traffic AI System (Advanced)</h1>

<div id="map"></div>

<button onclick="getLocation()">📍 Use My Location</button>

<form action="/predict" method="post" onsubmit="saveCoords()">
    <input id="start_lat" name="lat" placeholder="Start Latitude" required>
    <input id="start_lon" name="lon" placeholder="Start Longitude" required><br>

    <input id="end_lat" placeholder="Destination Latitude" required>
    <input id="end_lon" placeholder="Destination Longitude" required><br>

    <button type="submit">Predict & Route</button>
</form>

{% if prediction_text %}
<div class="card">
    <h2>{{ prediction_text }}</h2>
    <p>Temp: {{ temp }}</p>
    <p>Rain: {{ rain }}</p>
    <p>Hour: {{ hour }}</p>
</div>

<canvas id="chart"></canvas>
{% endif %}

<script>
// MAP
var map = L.map('map').setView([12.97,77.59],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// LAYERS
var heat = L.heatLayer([], {radius:25}).addTo(map);
var trafficLayer = L.layerGroup().addTo(map);

// CLICK MAP
map.on('click', function(e){
    document.getElementById("start_lat").value = e.latlng.lat;
    document.getElementById("start_lon").value = e.latlng.lng;
});

// GPS
function getLocation(){
    navigator.geolocation.getCurrentPosition(function(pos){
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        document.getElementById("start_lat").value = lat;
        document.getElementById("start_lon").value = lon;

        map.setView([lat,lon],13);
    });
}

// SAVE COORDS
function saveCoords(){
    localStorage.setItem("start_lat", document.getElementById("start_lat").value);
    localStorage.setItem("start_lon", document.getElementById("start_lon").value);
    localStorage.setItem("end_lat", document.getElementById("end_lat").value);
    localStorage.setItem("end_lon", document.getElementById("end_lon").value);
}

// DRAW ROUTE
function drawRoute(start, end, risk) {
    trafficLayer.clearLayers();

    let color = "green";
    if (risk.includes("High")) color = "red";
    else if (risk.includes("Medium")) color = "orange";

    let route = L.polyline([start, end], {
        color: color,
        weight: 6
    }).addTo(trafficLayer);

    animateVehicle(route);
}

// VEHICLE ANIMATION 🚗
function animateVehicle(route) {
    let latlngs = route.getLatLngs();
    let marker = L.marker(latlngs[0]).addTo(map);

    let i = 0;

    function move() {
        if (i < latlngs.length) {
            marker.setLatLng(latlngs[i]);
            i++;
            setTimeout(move, 300);
        }
    }

    move();
}

// LOAD
window.onload = function(){
    let s_lat = localStorage.getItem("start_lat");
    let s_lon = localStorage.getItem("start_lon");
    let e_lat = localStorage.getItem("end_lat");
    let e_lon = localStorage.getItem("end_lon");

    {% if prediction_text %}
    if(s_lat && s_lon && e_lat && e_lon){
        let start = [parseFloat(s_lat), parseFloat(s_lon)];
        let end = [parseFloat(e_lat), parseFloat(e_lon)];

        drawRoute(start, end, "{{ prediction_text }}");

        heat.addLatLng([s_lat, s_lon, 1]);
    }

    // CHART
    var ctx = document.getElementById("chart").getContext("2d");
    new Chart(ctx,{
        type:'bar',
        data:{
            labels:['Temp','Rain','Hour'],
            datasets:[{
                label:'Live Data',
                data:[{{ temp }},{{ rain }},{{ hour }}]
            }]
        }
    });
    {% endif %}
}
</script>

</body>
</html>
