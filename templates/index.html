<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>🚦 Traffic AI Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin:0;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg,#141e30,#243b55);
    color:white;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    padding:15px 25px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

/* LAYOUT */
.layout {
    display:flex;
    height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar {
    width:300px;
    padding:20px;
    background: rgba(255,255,255,0.08);
}

/* MAIN */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
}

/* MAP */
#map {
    height:400px;
    margin:10px;
    border-radius:15px;
}

/* PANEL */
.panel {
    display:flex;
    gap:10px;
    padding:10px;
}

/* CARD */
.card {
    flex:1;
    background: rgba(255,255,255,0.08);
    padding:15px;
    border-radius:15px;
}

/* INPUT */
input, button {
    width:100%;
    padding:10px;
    margin:5px 0;
    border-radius:8px;
    border:none;
}

button {
    background:#00e5ff;
    font-weight:bold;
}

/* TEXT */
#status { color:#00ffcc; }
#liveTime { color:#ffd700; }

</style>
</head>

<body>

<div class="header">
    <h2>🚦 Traffic AI Dashboard</h2>
    <div>
        <span id="liveTime"></span> |
        <span id="status">Ready</span>
    </div>
</div>

<div class="layout">

<!-- SIDEBAR -->
<div class="sidebar">
    <h3>📍 Route</h3>

    <input id="start_place" placeholder="Start location">
    <input id="end_place" placeholder="Destination">

    <button onclick="run()">🚀 Predict Route</button>

    <h3 id="result">--</h3>
    <p id="details"></p>
</div>

<!-- MAIN -->
<div class="main">

    <div id="map"></div>

    <div class="panel">
        <div class="card">
            <h3>📊 Analytics</h3>
            <canvas id="chart"></canvas>
        </div>

        <div class="card">
            <h3>🌦 Weather</h3>
            <p id="weatherBox">No data</p>
        </div>
    </div>

</div>

</div>

<script>

const API_URL = "/predict";

// ================= LIVE TIME =================
function updateTime(){
    document.getElementById("liveTime").innerText =
        new Date().toLocaleTimeString();
}
setInterval(updateTime,1000);
updateTime();

// ================= MAP =================
var map = L.map('map').setView([12.97,77.59],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var routeLayer;

// ================= GEOCODE =================
async function geocode(place){
    let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`);
    let data = await res.json();
    if(!data.length) throw "Location not found";
    return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon)};
}

// ================= ROUTE + DISTANCE =================
async function getRoute(start,end){
    let res = await fetch(
        `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`
    );

    let data = await res.json();

    return {
        coords: data.routes[0].geometry.coordinates,
        distance: (data.routes[0].distance / 1000).toFixed(2)
    };
}

// ================= DRAW =================
function draw(coords,risk){
    if(routeLayer) map.removeLayer(routeLayer);

    let pts = coords.map(c=>[c[1],c[0]]);

    let color = risk.includes("High")?"red":
                risk.includes("Medium")?"orange":"green";

    routeLayer = L.polyline(pts,{color,weight:6}).addTo(map);
    map.fitBounds(routeLayer.getBounds());
}

// ================= MAIN =================
async function run(){
    try{
        status.innerText = "⏳ Processing...";

        let s = await geocode(start_place.value);
        let e = await geocode(end_place.value);

        let res = await fetch(API_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                start_lat:s.lat,start_lon:s.lon,
                end_lat:e.lat,end_lon:e.lon
            })
        });

        let data = await res.json();

        result.innerText = data.prediction;

        let routeData = await getRoute([s.lat,s.lon],[e.lat,e.lon]);

        details.innerText =
`📍 Start: ${data.start_weather.temp}°C | Rain ${data.start_weather.rain}
📍 End: ${data.end_weather.temp}°C | Rain ${data.end_weather.rain}
⏰ Hour: ${data.hour}
📏 Distance: ${routeData.distance} km`;

        weatherBox.innerText =
`🌡 Start: ${data.start_weather.temp}°C
🌧 Start Rain: ${data.start_weather.rain}
🌡 End: ${data.end_weather.temp}°C
🌧 End Rain: ${data.end_weather.rain}`;

        draw(routeData.coords,data.prediction);

        updateChart(data);

        status.innerText = "✅ Done";

    }catch(e){
        status.innerText = "❌ Error";
        alert(e);
    }
}

// ================= CHART =================
let chart;

function updateChart(data){
    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"),{
        type:'line',
        data:{
            labels:["S Temp","S Rain","E Temp","E Rain","Hour"],
            datasets:[{
                data:[
                    data.start_weather.temp,
                    data.start_weather.rain,
                    data.end_weather.temp,
                    data.end_weather.rain,
                    data.hour
                ],
                borderColor:"#00e5ff",
                tension:0.4
            }]
        }
    });
}

</script>

</body>
</html>
