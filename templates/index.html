<!DOCTYPE html>
<html>
<head>
    <title>🚦 Real Time Traffic system </title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Routing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <!-- Heat -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin:0;
            font-family: 'Segoe UI';
            background: linear-gradient(135deg,#141e30,#243b55);
            color:white;
            text-align:center;
        }

        #map {
            height: 400px;
            border-radius:15px;
            margin:15px;
        }

        .glass {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding:15px;
            border-radius:15px;
            margin:10px;
        }

        input, button {
            padding:10px;
            border:none;
            border-radius:8px;
            margin:5px;
        }

        button {
            background:#00e5ff;
            font-weight:bold;
            cursor:pointer;
        }

        #clock {
            font-size:20px;
            color:#00ffcc;
        }
    </style>
</head>

<body>

<h1>🚦 Traffic AI PRO MAX</h1>

<div id="clock"></div>

<div id="map"></div>

<div class="glass">
<button onclick="getLocation()">📍 Use My Location</button>

<form onsubmit="handleSubmit(event)">
<input id="start_lat" placeholder="Start Latitude" required>
<input id="start_lon" placeholder="Start Longitude" required><br>

<input id="end_lat" placeholder="Destination Latitude" required>
<input id="end_lon" placeholder="Destination Longitude" required><br>

<button type="submit">🚀 Predict & Route</button>
</form>
</div>

<div class="glass">
<h2 id="result">Prediction: --</h2>
<p id="details"></p>
</div>

<canvas id="chart"></canvas>

<script>

// ================= MAP =================
var map = L.map('map').setView([12.97,77.59],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var heat = L.heatLayer([], {radius:25}).addTo(map);
var routingControl;

// ================= CLOCK =================
function updateClock(){
    const now = new Date();
    document.getElementById("clock").innerText =
        now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

// ================= GPS =================
function getLocation(){
    navigator.geolocation.getCurrentPosition(function(pos){
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        start_lat.value = lat;
        start_lon.value = lon;

        map.setView([lat,lon],13);
    });
}

// ================= ROUTING =================
function drawRoute(start, end, risk){

    if(routingControl){
        map.removeControl(routingControl);
    }

    let color = "green";
    if(risk.includes("High")) color="red";
    else if(risk.includes("Medium")) color="orange";

    routingControl = L.Routing.control({
        waypoints:[
            L.latLng(start[0],start[1]),
            L.latLng(end[0],end[1])
        ],
        routeWhileDragging:false,
        lineOptions:{
            styles:[{color:color, weight:6}]
        }
    }).addTo(map);

}

// ================= FAKE AI PREDICTION =================
function getPrediction(temp, rain, hour){
    if(rain > 5 || hour >= 18) return "🔴 High Risk Area";
    if(temp > 30) return "🟡 Medium Risk Area";
    return "🟢 Low Risk Area";
}

// ================= SUBMIT =================
function handleSubmit(e){
    e.preventDefault();

    let s_lat = parseFloat(start_lat.value);
    let s_lon = parseFloat(start_lon.value);
    let e_lat = parseFloat(end_lat.value);
    let e_lon = parseFloat(end_lon.value);

    let hour = new Date().getHours();
    let temp = Math.floor(Math.random()*10)+25;
    let rain = Math.floor(Math.random()*10);

    let result = getPrediction(temp,rain,hour);

    document.getElementById("result").innerText = result;
    document.getElementById("details").innerText =
        `Temp: ${temp}°C | Rain: ${rain}mm | Hour: ${hour}`;

    drawRoute([s_lat,s_lon],[e_lat,e_lon],result);

    heat.addLatLng([s_lat,s_lon,Math.random()]);

    updateChart(temp,rain,hour);
}

// ================= CHART =================
var chart;

function updateChart(temp,rain,hour){
    if(chart) chart.destroy();

    var ctx = document.getElementById("chart").getContext("2d");

    chart = new Chart(ctx,{
        type:'line',
        data:{
            labels:['Temp','Rain','Hour'],
            datasets:[{
                label:'Live Metrics',
                data:[temp,rain,hour]
            }]
        }
    });
}

// ================= AUTO LIVE UPDATE =================
setInterval(()=>{
    let hour = new Date().getHours();
    document.getElementById("clock").innerText =
        "Live Time: " + new Date().toLocaleTimeString();
},1000);

</script>

</body>
</html>
