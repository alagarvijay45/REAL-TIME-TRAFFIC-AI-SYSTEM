<!DOCTYPE html>
<html>
<head>
    <title>Traffic AI System</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Heatmap -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #1e3c72;
            color: white;
            text-align: center;
        }

        #map {
            height: 400px;
            margin: 20px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        .card {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>🚦 Traffic AI</h1>

<div id="map"></div>

<button onclick="getLocation()">📍 Use My Location</button>

<form action="/predict" method="post" onsubmit="saveCoords()">
    <input id="lat" name="lat" placeholder="Latitude" required>
    <input id="lon" name="lon" placeholder="Longitude" required><br>
    <button type="submit">Predict</button>
</form>

{% if prediction_text %}
<div class="card">
    <h2>{{ prediction_text }}</h2>
    <p>Temp: {{ temp }}</p>
    <p>Rain: {{ rain }}</p>
    <p>Hour: {{ hour }}</p>
</div>

<canvas id="chart"></canvas>
{% endif %}

<script>
// MAP
var map = L.map('map').setView([12.97,77.59],10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// HEATMAP
var heat = L.heatLayer([], {radius:25}).addTo(map);

// TRAFFIC LAYER
var trafficLayer = L.layerGroup().addTo(map);

// CLICK MAP
map.on('click', function(e){
    document.getElementById("lat").value = e.latlng.lat;
    document.getElementById("lon").value = e.latlng.lng;
});

// GPS
function getLocation(){
    navigator.geolocation.getCurrentPosition(function(pos){
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        document.getElementById("lat").value = lat;
        document.getElementById("lon").value = lon;

        map.setView([lat,lon],13);
    });
}

// SAVE COORDS
function saveCoords(){
    localStorage.setItem("lat", document.getElementById("lat").value);
    localStorage.setItem("lon", document.getElementById("lon").value);
}

// TRAFFIC VISUALIZATION
function showTraffic(lat, lon, risk) {
    trafficLayer.clearLayers();

    let color = "green";

    if (risk.includes("High")) color = "red";
    else if (risk.includes("Medium")) color = "orange";

    let line = L.polyline([
        [lat, lon],
        [lat + 0.01, lon + 0.01]
    ], {color: color, weight: 6});

    line.addTo(trafficLayer);
}

// LOAD
window.onload = function(){
    let lat = localStorage.getItem("lat");
    let lon = localStorage.getItem("lon");

    if(lat && lon){
        heat.addLatLng([lat, lon, 1]);
    }

    {% if prediction_text %}
    if(lat && lon){
        showTraffic(parseFloat(lat), parseFloat(lon), "{{ prediction_text }}");
    }

    var ctx = document.getElementById("chart").getContext("2d");
    new Chart(ctx,{
        type:'bar',
        data:{
            labels:['Temp','Rain','Hour'],
            datasets:[{
                label:'Live Data',
                data:[{{ temp }},{{ rain }},{{ hour }}]
            }]
        }
    });
    {% endif %}
}
</script>

</body>
</html>
